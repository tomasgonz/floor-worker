name: image

on:
  push:
    branches: [main]
    paths: ["Dockerfile", "handler.py", ".github/workflows/image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Room for a CUDA image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/tomasgonz/floor-worker:latest
            ghcr.io/tomasgonz/floor-worker:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/tomasgonz/floor-worker
